apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: multi-tier-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
        - name: vote
          image: rimo9docker/vote-app:latest
          ports:
            - containerPort: 80
          env:
            - name: REDIS_HOST
              value: redis
